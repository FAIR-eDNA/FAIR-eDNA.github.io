site_name: FAIR eDNA
site_url: https://fair-edna.github.io/
nav:
  - Home: index.md
  - Guidelines: guidelines.md
  - Our next steps: next.md
  - Download: download.md
  - News & Updates: update.md
  - Working group: workinggroup.md
  - How to contribute: contact.md  
  - How to cite: citation.md

theme:
  name: material
  custom_dir: overrides
  logo: assets/images/ednafair_icon.svg
  favicon: assets/images/ednafair_icon.svg
  palette:
    # Palette toggle for automatic mode
    - media: "(prefers-color-scheme)"
      primary: teal
      accent: green
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default 
      primary: teal
      accent: green
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: green
      toggle:
        icon: material/weather-night
        name: Switch to system preference
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - toc.integrate
    - navigation.top
plugins:
  - i18n:
      docs_structure: folder
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true

      languages:
        - locale: en
          default: true
          name: English
          build: true

        - locale: ja
          name: 日本語
          build: true

          nav_translations:
            Home: ホーム
            Guidelines: ガイドライン
            Our next steps: 今後の取り組み
            Download: ダウンロード
            News & Updates: ニュース・更新情報
            Working group: ワーキンググループ
            How to contribute: 貢献するには
            How to cite: 引用方法

  - offline

  - search:
      lang:
        - en
        - ja

extra:
  alternate:
    - name: English
      link: /
      lang: en
    - name: 日本語
      link: /ja/
      lang: ja
