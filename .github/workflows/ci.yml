name: ci

on:
  push:
    branches:
      - master
      - main

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Pin mkdocs if you want (optional). Use the same version you use locally:
          pip install "mkdocs==1.6.1" "mkdocs-material" "mkdocs-i18n-plugin" "mkdocs-i18n"

      - name: Deploy with mkdocs
        env:
          CI: true
        run: |
          # Ensure mkdocs command is available from the installed packages
          python -m mkdocs gh-deploy --force
