{# overrides/partials/header.html - template-based language switcher (MkDocs Material) #}
{% set p = page.url %}
<div class="md-header-nav__button" style="margin-left:0.5rem;">
  {% if p.startswith('ja/') %}
    <a class="md-nav__link" href="/{{ p[3:] }}" lang="en" rel="alternate">English</a>
    &nbsp;|&nbsp;
    <a class="md-nav__link" href="/{{ p }}" lang="ja" aria-current="page">日本語</a>
  {% else %}
    <a class="md-nav__link" href="/{{ p }}" lang="en" aria-current="page">English</a>
    &nbsp;|&nbsp;
    <a class="md-nav__link" href="/ja/{{ p }}" lang="ja" rel="alternate">日本語</a>
  {% endif %}
</div>
